# The comparison this whole project exists to make possible.
#
# A 32-GPU job that requires every GPU in one NVLink domain. Submitted unchanged against
# two topologies:
#
#   two-racks-h100  a DGX H100 domain holds 8 GPUs -> refused, no pod placed
#   gb200-nvl72     an NVL72 domain holds 72       -> placed across 8 trays, one domain
#
# Same workload, same scheduler, different hardware — and the answer arrives without owning
# either machine. On real hardware the difference is roughly €2M of rack.
#
# TOPOLOGY_NAME is substituted by hack/run-smoke.sh, because the annotation names the
# topology object and that name differs between the two files.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: any-gpu
  namespace: gpu-sim-test
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nvlink-32
  namespace: gpu-sim-test
  annotations:
    kai.scheduler/batch-min-member: "32"
    kai.scheduler/topology: "TOPOLOGY_NAME"
    kai.scheduler/topology-required-placement: "nvlink-domain"
spec:
  parallelism: 32
  completions: 32
  template:
    metadata:
      labels:
        kai.scheduler/queue: default-queue
    spec:
      schedulerName: kai-scheduler
      restartPolicy: Never
      nodeSelector:
        type: kwok
      tolerations:
        - key: kwok.x-k8s.io/node
          operator: Equal
          value: fake
          effect: NoSchedule
      containers:
        - name: main
          image: ubuntu:24.04
          command: ["sleep", "infinity"]
          resources:
            claims:
              - name: gpu
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: any-gpu
