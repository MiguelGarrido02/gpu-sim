# Phase 0 acceptance test: a gang-scheduled GPU workload on a fully simulated cluster.
#
# The gang is expressed with an explicit PodGroup rather than through a Job, for two
# reasons. First, KAI's pod-grouper gives a plain Job minMember=1 unless it carries the
# kai.scheduler/batch-min-member annotation, so a Job silently degrades into independent
# per-pod scheduling and the test would pass without ever exercising gang semantics.
# Second, an explicit PodGroup is the contract the Phase 3 scenario harness will use, so
# testing it here validates the path that actually matters later.
#
# Pods use restartPolicy: Always so that KWOK's pod-complete stage leaves them Running;
# a terminal pod releases its ResourceClaim, which would hide whether the GPU was ever
# really allocated.
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-sim-test
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: single-gpu
  namespace: gpu-sim-test
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
---
apiVersion: scheduling.run.ai/v2alpha2
kind: PodGroup
metadata:
  name: gang-of-two
  namespace: gpu-sim-test
spec:
  minMember: 2
  queue: default-queue
---
apiVersion: v1
kind: Pod
metadata:
  name: gang-member-1
  namespace: gpu-sim-test
  annotations:
    pod-group-name: gang-of-two
  labels:
    kai.scheduler/queue: default-queue
    kai.scheduler/skip-podgrouper: "true"
spec:
  schedulerName: kai-scheduler
  restartPolicy: Always
  nodeSelector:
    type: kwok
  tolerations:
    - key: kwok.x-k8s.io/node
      operator: Equal
      value: fake
      effect: NoSchedule
  containers:
    - name: main
      image: ubuntu:24.04
      command: ["sleep", "infinity"]
      resources:
        claims:
          - name: gpu
  resourceClaims:
    - name: gpu
      resourceClaimTemplateName: single-gpu
---
apiVersion: v1
kind: Pod
metadata:
  name: gang-member-2
  namespace: gpu-sim-test
  annotations:
    pod-group-name: gang-of-two
  labels:
    kai.scheduler/queue: default-queue
    kai.scheduler/skip-podgrouper: "true"
spec:
  schedulerName: kai-scheduler
  restartPolicy: Always
  nodeSelector:
    type: kwok
  tolerations:
    - key: kwok.x-k8s.io/node
      operator: Equal
      value: fake
      effect: NoSchedule
  containers:
    - name: main
      image: ubuntu:24.04
      command: ["sleep", "infinity"]
      resources:
        claims:
          - name: gpu
  resourceClaims:
    - name: gpu
      resourceClaimTemplateName: single-gpu
