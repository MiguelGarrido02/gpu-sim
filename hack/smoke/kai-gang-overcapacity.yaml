# Phase 0 acceptance test, negative half: a gang larger than the cluster must not be
# scheduled at all.
#
# Placing a gang that fits proves very little on its own — a scheduler that ignored gang
# semantics entirely would pass that test. What distinguishes gang scheduling is the
# all-or-nothing guarantee, so this job requests more GPUs than the simulated cluster
# has and asserts that *zero* pods are placed rather than a partial, deadlocked
# allocation.
#
# It also exercises the Job path: without kai.scheduler/batch-min-member, KAI's
# pod-grouper builds a PodGroup with minMember=1 and the pods are scheduled
# independently, which would fill the cluster instead of staying pending.
apiVersion: batch/v1
kind: Job
metadata:
  name: gang-overcapacity
  namespace: gpu-sim-test
  annotations:
    kai.scheduler/batch-min-member: "40"
spec:
  parallelism: 40
  completions: 40
  template:
    metadata:
      labels:
        kai.scheduler/queue: default-queue
    spec:
      schedulerName: kai-scheduler
      restartPolicy: Never
      nodeSelector:
        type: kwok
      tolerations:
        - key: kwok.x-k8s.io/node
          operator: Equal
          value: fake
          effect: NoSchedule
      containers:
        - name: main
          image: ubuntu:24.04
          command: ["sleep", "infinity"]
          resources:
            claims:
              - name: gpu
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: single-gpu
