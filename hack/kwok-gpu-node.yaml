# Template for a simulated GPU node. NODE_NAME and NODE_POOL are substituted by
# hack/setup-cluster.sh.
#
# The kwok.x-k8s.io/node annotation hands the node's lifecycle to the KWOK controller,
# and the matching taint keeps real DaemonSets off it — simulated nodes have no kubelet,
# so anything landing there without a toleration would hang in Pending forever.
#
# The run.ai/simulated-gpu-node-pool label is what makes fake-gpu-operator's
# status-updater adopt the node and assign it the GPU configuration of that pool.
#
# The kubernetes.io/hostname, os and arch labels are not decoration. A real kubelet
# registers them on every node, so schedulers assume they are always present. KAI's
# topology plugin in particular drops any node missing a label for *any* level of its
# Topology CR, and `kubernetes.io/hostname` is the conventional leaf level — omit it and
# the topology tree comes out empty, which surfaces as every topology-constrained
# workload failing with "not enough resources in the cluster" no matter how idle the
# cluster is. A simulated node has no kubelet to add them, so they are declared here.
apiVersion: v1
kind: Node
metadata:
  name: NODE_NAME
  annotations:
    kwok.x-k8s.io/node: fake
    node.alpha.kubernetes.io/ttl: "0"
  labels:
    type: kwok
    kubernetes.io/hostname: NODE_NAME
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
    kubernetes.io/role: worker
    node.kubernetes.io/instance-type: gpu-node
    run.ai/simulated-gpu-node-pool: NODE_POOL
spec:
  taints:
    - key: kwok.x-k8s.io/node
      value: fake
      effect: NoSchedule
status:
  allocatable:
    cpu: "128"
    memory: 2Ti
    pods: "110"
  capacity:
    cpu: "128"
    memory: 2Ti
    pods: "110"
  nodeInfo:
    architecture: amd64
    containerRuntimeVersion: fake
    kernelVersion: fake
    kubeProxyVersion: fake
    kubeletVersion: fake
    operatingSystem: linux
    osImage: fake
