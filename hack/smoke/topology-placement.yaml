# Phase 1 acceptance test: a job that must fit inside one NVLink rack.
#
# Twelve GPUs is chosen deliberately. It does not fit on one node (8 GPUs), so placing it
# requires reasoning at the rack level rather than falling back to "put it all on one
# machine". It does fit inside one rack (16 GPUs), so a correct scheduler places it.
#
# Expected: all 12 pods Running, all within a single value of gpu-sim.io/rack.
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-sim-test
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: single-gpu
  namespace: gpu-sim-test
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rack-local-training
  namespace: gpu-sim-test
  annotations:
    # Without this the pod-grouper builds a PodGroup with minMember=1 and the pods are
    # scheduled independently, which would satisfy the placement assertion by accident
    # while testing nothing about gang scheduling.
    kai.scheduler/batch-min-member: "12"
    kai.scheduler/topology: "two-racks-h100"
    kai.scheduler/topology-required-placement: "rack"
spec:
  parallelism: 12
  completions: 12
  template:
    metadata:
      labels:
        kai.scheduler/queue: default-queue
    spec:
      schedulerName: kai-scheduler
      restartPolicy: Never
      nodeSelector:
        type: kwok
      tolerations:
        - key: kwok.x-k8s.io/node
          operator: Equal
          value: fake
          effect: NoSchedule
      containers:
        - name: main
          image: ubuntu:24.04
          command: ["sleep", "infinity"]
          resources:
            claims:
              - name: gpu
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: single-gpu
