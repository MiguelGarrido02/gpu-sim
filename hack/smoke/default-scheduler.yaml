# The simulated GPUs must work without KAI Scheduler.
#
# Two of gpu-sim's three projections are plain Kubernetes: DRA ResourceSlices are core API
# as of v1.34, and node labels are just labels. Only the Topology object is KAI's. If that
# is true, the stock kube-scheduler can allocate a simulated GPU and honour a CEL selector
# on its attributes, with nothing from KAI involved — no schedulerName, no queue label, no
# PodGroup.
#
# Worth asserting rather than assuming. The whole suite otherwise runs through KAI, so a
# change that quietly coupled the device attributes to it would go unnoticed until someone
# tried gpu-sim with Kueue, Volcano, or no scheduler at all.
#
# The pod selects NUMA node 1 specifically: allocating *a* GPU would only prove DRA works,
# whereas allocating one on the requested socket proves the attributes gpu-sim publishes
# are being read and filtered on by core Kubernetes.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: numa1-gpu
  namespace: gpu-sim-test
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
            selectors:
              - cel:
                  expression: device.attributes['gpu.nvidia.com'].numaNode == 1
---
apiVersion: v1
kind: Pod
metadata:
  name: default-scheduler-gpu
  namespace: gpu-sim-test
spec:
  # No schedulerName: this is the stock kube-scheduler.
  restartPolicy: Always
  nodeSelector:
    type: kwok
  tolerations:
    - key: kwok.x-k8s.io/node
      operator: Equal
      value: fake
      effect: NoSchedule
  containers:
    - name: main
      image: ubuntu:24.04
      command: ["sleep", "infinity"]
      resources:
        claims:
          - name: gpu
  resourceClaims:
    - name: gpu
      resourceClaimTemplateName: numa1-gpu
